services:
  store:
    build: .
    container_name: oyu-store
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    mem_limit: 384m
    init: true

