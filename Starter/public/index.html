<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Жанам стартер</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<style>
:root{--bg:#f3f3f2;--surface:#fff;--ink:#111;--muted:#6b6b6b;--line:#e2e2e0;--sale:#e8431a}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--surface:#1f1f1f;--ink:#f2f2f2;--muted:#a0a0a0;--line:#333;--sale:#ff6a3d;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Roboto,sans-serif}
a{color:inherit}button{font:inherit;cursor:pointer}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--sale);outline-offset:2px}
header{background:#000;color:#fff;position:sticky;top:0;z-index:5}
.bar{max-width:1400px;margin:auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.logo{font:700 28px/1 Roboto,sans-serif;letter-spacing:.04em;color:#fff;text-decoration:none}
.search{flex:1;max-width:560px;margin:auto;display:flex}
.search input{flex:1;min-width:0;border:0;border-radius:20px 0 0 20px;padding:9px 16px;font:inherit;background:#fff;color:#111}
.search button{border:0;border-radius:0 20px 20px 0;background:var(--sale);color:#fff;padding:0 16px}
.icons{display:flex;gap:4px;align-items:center}
.ic{position:relative;background:none;border:0;color:#fff;padding:8px;font-size:17px}
.badge{position:absolute;top:0;right:0;background:var(--sale);color:#fff;border-radius:9px;font-size:11px;min-width:17px;height:17px;line-height:17px;text-align:center}
nav ul{max-width:1400px;margin:auto;padding:0 20px;list-style:none;display:flex;gap:22px;overflow-x:auto;white-space:nowrap;border-top:1px solid #222}
nav a{display:block;padding:10px 0;color:#ddd;text-decoration:none;border-bottom:2px solid transparent}
nav a:hover,nav a.on{color:#fff;border-color:var(--sale)}nav a.sale{color:#ff8a66}
main{max-width:1400px;margin:auto;padding:20px;min-height:60vh}
.h{font:700 24px Roboto,sans-serif;margin:0 0 14px}
.hero{border-radius:6px;background:linear-gradient(120deg,#111,#3a2a26);color:#fff;padding:60px 7%;margin-bottom:10px}
.hero h1{font:700 clamp(28px,5vw,54px)/1.05 Roboto,sans-serif;margin:0 0 10px;max-width:14em}.hero p{margin:0 0 18px;color:#ddd}
.btn{background:#000;color:#fff;border:0;padding:10px 20px;border-radius:3px;font-weight:600;text-decoration:none;display:inline-block}
.btn.w{background:#fff;color:#000}.btn.o{background:var(--sale)}.btn.g{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.5;cursor:not-allowed}
section{margin-top:32px}.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.sh h2{margin:0;font:700 21px Roboto,sans-serif}.sh a{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (max-width:800px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.bar{flex-wrap:wrap;gap:8px}.search{order:3;flex-basis:100%;max-width:none}.logo{font-size:24px}.icons{margin-left:auto}}
.card{background:var(--surface);border-radius:4px;overflow:hidden;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.ph{aspect-ratio:3/4;display:grid;place-items:center;position:relative;overflow:hidden}.ph svg{width:46%;opacity:.85}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.so{position:absolute;bottom:8px;left:8px;background:#000;color:#fff;font-size:12px;padding:2px 8px;border-radius:2px}
.info{padding:10px 12px 12px}.name{font-size:13px;margin:0 0 6px;min-height:2.6em;overflow:hidden}
.box{background:var(--surface);padding:18px;border-radius:4px}.err{color:var(--sale);min-height:1.4em}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}@media (max-width:800px){.two{grid-template-columns:1fr}}
label{display:block;margin:10px 0 4px;font-weight:600}input,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);font:inherit}
#map{height:300px;border-radius:4px;margin:8px 0;z-index:0}.r{display:flex;justify-content:space-between;margin:4px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:30;padding:12px}.dlg{background:var(--surface);padding:20px;border-radius:6px;max-width:380px;width:100%}.dlg h3{margin:0 0 8px}
.st{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--line);font-size:12px}mark{background:#ffe08a}
footer.footer{background:#101010;color:#f5f3ef;padding:30px 20px 14px;font-size:13px}
.footer-inner{max-width:1040px;margin:auto;display:grid;grid-template-columns:minmax(250px,1.1fr) minmax(260px,.9fr);gap:32px;align-items:start}
.footer section{margin:0}.footer-contact h2,.footer-map h2{font:700 19px Roboto,sans-serif;margin:0 0 6px;color:#fff}.accent-line{display:block;width:42px;height:3px;background:var(--sale);border-radius:3px;margin:0 0 13px}
.contact-list{display:grid;gap:7px}.contact-row{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;background:#1b1b1b;border:1px solid #2b2b2b;border-radius:6px;color:#d7d4cf;text-decoration:none;line-height:1.55;transition:background .2s,border-color .2s}.contact-row:hover{background:#242424;border-color:#484848}.contact-icon{width:22px;flex:none;text-align:center;color:#ff7956}.contact-values{display:grid;gap:3px}.contact-values a{color:#fff;text-decoration:none}.contact-values a:hover,.footer-link:hover{text-decoration:underline}.footer-link{color:#fff;text-decoration:none}.footer-map-frame{position:relative;width:100%;max-width:1000px;aspect-ratio:2.2/1;max-height:500px;overflow:hidden;border:1px solid #333;border-radius:7px;background:#1b1b1b}.footer-map-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.footer-bottom{max-width:1040px;margin:18px auto 0;padding-top:11px;border-top:1px solid #303030;color:#96928c;font-size:12px}
@media(max-width:720px){.footer-inner{grid-template-columns:1fr;gap:22px}.footer-map-frame{aspect-ratio:1.85/1;max-height:235px}footer.footer{padding:26px 16px 13px}}
.pd{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:28px}@media (max-width:800px){.pd{grid-template-columns:1fr}}
.gmain{aspect-ratio:3/4;background:var(--surface);border-radius:4px;overflow:hidden;position:relative}.gmain img{width:100%;height:100%;object-fit:cover;display:block}.gmain button{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}.thumbs button{width:64px;aspect-ratio:3/4;padding:0;border:2px solid transparent;border-radius:3px;overflow:hidden;flex:none;background:var(--surface)}.thumbs button.on{border-color:var(--sale)}.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.crumb{color:var(--muted);margin-bottom:10px}.crumb a{text-decoration:underline}.desc{white-space:pre-wrap;line-height:1.6}.pinfo h1{font:700 26px/1.2 Roboto,sans-serif;margin:0 0 8px}
.srch{margin:6px 0}.srch input{flex:1;min-width:0}.srch .btn{padding:9px 14px}.sres button{display:block;width:100%;text-align:left;padding:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-top:4px;border-radius:3px}gmp-place-autocomplete{width:100%;color-scheme:light}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="#" aria-label="Жанам стартер home">Жанам стартер</a>
    <form class="search" role="search" id="sf"><input id="q" type="search" placeholder="Бүтээгдэхүүн хайх..." aria-label="Search products"><button aria-label="Search">Search</button></form>
    <div class="icons">
    </div>
  </div>
  <nav aria-label="Categories"><ul id="nav"></ul></nav>
</header>
<main id="app"><div class="box">Loading…</div></main>
<footer class="footer">
  <div class="footer-inner">
    <section class="footer-contact" aria-labelledby="footer-contact-title">
      <h2 id="footer-contact-title">Холбоо барих</h2>
      <span class="accent-line"></span>
      <div class="contact-list">
        <div class="contact-row"><span class="contact-icon" aria-hidden="true">📞</span><span class="contact-values"><a href="tel:+97688119294">(+976) 8811 9294</a><a href="tel:+97696559898">(+976) 9655 9898</a></span></div>
        <a class="contact-row" href="mailto:Natsgaa1225@gmail.com"><span class="contact-icon" aria-hidden="true">✉</span><span>Natsgaa1225@gmail.com</span></a>
        <a class="contact-row" href="https://maps.app.goo.gl/pzsenczd5LwvA3o78" target="_blank" rel="noopener noreferrer"><span class="contact-icon" aria-hidden="true">📍</span><span>Товчооны зам 56 тоот, Улаанбаатар хот<br>FOTON Center<br><small>Google Maps дээр нээх</small></span></a>
        <a class="contact-row footer-link" href="https://www.facebook.com/starterjanam" target="_blank" rel="noopener noreferrer"><span class="contact-icon" aria-hidden="true">f</span><span>Facebook</span></a>
      </div>
    </section>
    <section class="footer-map" aria-labelledby="footer-map-title">
      <h2 id="footer-map-title">Бидний байршил</h2>
      <span class="accent-line"></span>
      <div class="footer-map-frame"><iframe title="Жанам стартер байршил — FOTON Center" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d397.5776376017907!2d106.76540225839977!3d47.90595167941059!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5d96eda55cac92fb%3A0xbf5e23d13a40c414!2sFOTON%20Center!5e0!3m2!1sen!2smn!4v1793613156903!5m2!1sen!2smn" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    </section>
  </div>
  <div class="footer-bottom">© 2026 Жанам стартер</div>
</footer>

<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(m,p,b){const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.error||'Something went wrong. Please try again.');e.status=r.status;throw e}return j}
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ICON={dress:'<path d="M35 5h30l-6 25 20 65H21l20-65z"/>',top:'<path d="M30 10l-22 18 10 14 12-8v52h40V34l12 8 10-14-22-18c-4 8-10 12-20 12S34 18 30 10z"/>',pants:'<path d="M28 5h44l8 90H58L50 40l-8 55H20z"/>',bag:'<path d="M18 35h64l6 60H12zM34 35c0-18 32-18 32 0" stroke="currentColor" stroke-width="6" fill-rule="evenodd"/>',shoe:'<path d="M5 60l30-6 20-26 10 6 8 20 22 10v16H5z"/>',acc:'<circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="12"/>'};
const TN={dress:'\u042f\u043f\u043e\u043d',top:'\u0425\u044f\u0442\u0430\u0434',pants:'\u0421\u043e\u043b\u043e\u043d\u0433\u043e\u0441',bag:'\u0410\u043c\u0435\u0440\u0438\u043a',shoe:'\u0415\u0432\u0440\u043e\u043f'};
const catName=slug=>TN[slug]||categories.find(c=>c.slug===slug)?.name||slug;
const catHash=slug=>encodeURIComponent(catName(slug));
const catSlug=hash=>categories.find(c=>catHash(c.slug)===hash)?.slug||Object.keys(TN).find(slug=>catHash(slug)===hash);
let P=[],categories=[],q='',shown=20,loadErr=false;
const byId=id=>P.find(p=>p.id===id);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2400)}
function hl(s){s=esc(s);if(!q)return s;try{return s.replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),m=>'<mark>'+m+'</mark>')}catch(e){return s}}
function media(p){const h=(p.id*47)%360;return `<div class="ph" style="background:hsl(${h},30%,82%);color:hsl(${h},40%,30%)">${p.img?`<img src="${esc(p.img)}" alt="" loading="lazy">`:`<svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">${ICON[p.type]||ICON.acc}</svg>`}`}
function card(p){const out=p.stock<1;return `<article class="card" data-open="${p.id}" style="cursor:pointer">${media(p)}${out?'<span class="so">Sold out</span>':''}</div><div class="info"><h3 class="name"><a href="#p-${p.id}" style="text-decoration:none">${hl(p.name)}</a></h3></div></article>`}
const grid=l=>l.length?`<div class="grid">${l.slice(0,shown).map(card).join('')}</div>`+(l.length>shown?'<p style="text-align:center;margin-top:16px"><button class="btn g" data-act="more">Load more</button></p>':''):'<div class="box">Бүтээгдэхүүн олдсонгүй. Өөрөөр хайж үзэх эсвэл өөр ангилал сонгоно уу.</div>';
const sec=(t,to,l)=>l.length?`<section><div class="sh"><h2>${t}</h2><a href="#${to}">View all</a></div><div class="grid">${l.slice(0,5).map(card).join('')}</div></section>`:'';
let detail={},gi=0,curP=0;
function zoomImg(u){const o=document.createElement('div');o.className='ov';o.setAttribute('role','dialog');o.setAttribute('aria-label','Photo');o.tabIndex=-1;o.innerHTML=`<img src="${esc(u)}" alt="" style="max-width:96vw;max-height:94vh;border-radius:4px;cursor:zoom-out">`;o.onclick=()=>o.remove();o.onkeydown=e=>{if(e.key==='Escape')o.remove()};document.body.appendChild(o);o.focus()}
function detailView(id){const p=byId(id);if(!p)return `<div class="box">This product is not available. <a href="#">Back to shop</a></div>`;
const d=detail[id];if(!d){api('GET','/api/products/'+id).then(x=>{detail[id]=x;render()}).catch(()=>{detail[id]={...p,images:p.img?[p.img]:[],description:''};render()});return '<div class="box">Loading…</div>'}
if(curP!==id){curP=id;gi=0}
const imgs=d.images||[],cur=imgs[gi]||null,out=p.stock<1,rel=P.filter(x=>x.type===p.type&&x.id!==id).slice(0,5);
const stock=out?'<b style="color:var(--sale)">Sold out</b>':p.stock<=5?`<b style="color:var(--sale)">Only ${p.stock} left</b>`:'In stock';
return `<div class="crumb"><a href="#">Home</a> / <a href="#${catHash(p.type)}">${esc(catName(p.type))}</a> / ${esc(p.name)}</div><div class="pd"><div><div class="gmain">${cur?`<button data-act="zoom" aria-label="Zoom photo"><img src="${esc(cur)}" alt="${esc(p.name)}"></button>`:`${media(p)}</div>`}</div>`+
(imgs.length>1?`<div class="thumbs">${imgs.map((u,i)=>`<button data-act="gal" data-i="${i}" class="${i===gi?'on':''}" aria-label="Photo ${i+1} of ${imgs.length}"><img src="${esc(u)}" alt=""></button>`).join('')}</div>`:'')+
`</div><div class="pinfo"><h1>${esc(p.name)}</h1><p>${stock}</p>`+


`<h3>Description</h3><div class="desc">${d.description?esc(d.description):'No description yet.'}</div></div></div>`+
(rel.length?`<section><div class="sh"><h2>You may also like</h2></div><div class="grid">${rel.map(card).join('')}</div></section>`:'')}
function allCategoryView(){return `<h1 class="h">\u0411\u04af\u0433\u0434</h1>`+categories.map(c=>{const items=P.filter(p=>p.type===c.slug);return `<section id="${catName(c.slug)}"><div class="sh"><h2>${esc(catName(c.slug))}</h2><a href="#${catHash(c.slug)}">View all</a></div>${grid(items)}</section>`}).join('')}
function view(){const h=location.hash.slice(1);if(loadErr)return `<div class="box"><p>We could not load the products.</p><button class="btn" data-act="retry">Try again</button></div>`;
if(h.startsWith('p-'))return detailView(+h.slice(2));
if(q)return `<h1 class="h">Results for “${esc(q)}”</h1>`+grid(P.filter(p=>(p.name+' '+catName(p.type)).toLowerCase().includes(q.toLowerCase())));
if(h==='all'||h==='t-dress')return allCategoryView();
if(h==='new')return `<h1 class="h">Шинээр ирсэн</h1>`+grid(P.slice().sort((a,b)=>b.id-a.id));
const namedCategory=catSlug(h);if(namedCategory)return `<h1 class="h">${esc(catName(namedCategory))}</h1>`+grid(P.filter(p=>p.type===namedCategory));
if(h.startsWith('cat-')||h.startsWith('t-')){const t=h.startsWith('cat-')?h.slice(4):h.slice(2);return `<h1 class="h">${esc(TN[t]||'Products')}</h1>`+grid(P.filter(p=>p.type===t))}
const nw=P.slice().sort((a,b)=>b.id-a.id);
return `<div class="hero"><h1>Бүх төрлийн автомашин болон хүнд машин механизм</h1><p>ЖАНАМ-СТАРТЕР худалдаа/ засвар үйлчилгээ</p><a class="btn w" href="#new">Шинээр ирсэн</a></div>`+sec('Шинээр ирсэн','new',nw)+`<section><div class="sh"><h2>All products</h2></div>${grid(P)}</section>`}
function render(){const h=location.hash.slice(1);$('#app').innerHTML=view();
$('#nav').innerHTML=[['new','\u0428\u0438\u043d\u044d\u044d\u0440 \u0438\u0440\u0441\u044d\u043d'],['all','\u0411\u04af\u0433\u0434'],...categories.map(c=>[catHash(c.slug),catName(c.slug)])].map(([k,v])=>`<li><a href="#${k}" class="${h===k?'on ':''}">${esc(v)}</a></li>`).join('');
}
document.addEventListener('click',async e=>{const oc=e.target.closest('.card[data-open]');if(oc&&!e.target.closest('button,a')){location.hash='p-'+oc.dataset.open;return}const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset,id=+d.id;
switch(d.act){
case 'go':location.hash=d.to;break;



case 'more':shown+=20;render();break;
case 'retry':await loadProducts();render();break;
case 'gal':gi=+d.i;render();break;

case 'zoom':{const dd=detail[curP],u=dd&&dd.images[gi];if(u)zoomImg(u)}break;


}});
$('#sf').onsubmit=e=>{e.preventDefault();q=$('#q').value.trim();shown=20;if(location.hash)location.hash='';else render()};
addEventListener('hashchange',()=>{if(location.hash.slice(1)!==''){q='';$('#q').value=''}shown=20;render();scrollTo(0,0)});
async function loadProducts(){try{[P,categories]=await Promise.all([api('GET','/api/products'),api('GET','/api/categories')]);loadErr=false}catch(e){loadErr=true}}
(async()=>{await loadProducts();render()})();
</script>
</body>
</html>
